dataset_overrides:
  institution_id: NCC
  nominal_resolution: 200 km
  source_id: NorESM3

variables:
 
  cl_tpt-al-hxy-u:
    description: Cloud fraction
    dims: [lon, lat, lev, time1]
    formula: CLOUD*100
    levels: {name: standard_hybrid_sigma, src_axis_bnds: ilev, src_axis_name: lev,
      units: '1'}
    sources: [model_var: CLOUD]
    table: atmos
    units: fraction

  clh_tpt-u-hxy-u:
    description: Vertically-integrated high cloud
    dims: [lon, lat, time1]
    formula: CLDHGH*100
    sources: [model_var: CLDHGH]
    table: atmos
    units: fraction

  clhmodis_tpt-u-hxy-u:
    description: MODIS High Level Cloud Fraction
    dims: [lon, lat, time1]
    sources: [model_var: CLHMODIS]
    table: atmos
    units: percent

  cli_tpt-al-hxy-u:
    description: Grid box averaged cloud ice amount
    dims: [lon, lat, lev, time1]
    levels: {name: standard_hybrid_sigma, src_axis_bnds: ilev, src_axis_name: lev,
      units: '1'}
    sources: [model_var: CLDICE]
    table: atmos
    units: kg/kg

  climodis_tpt-u-hxy-u:
    description: MODIS Ice Cloud Fraction
    dims: [lon, lat, time1]
    sources: [model_var: CLIMODIS]
    table: atmos
    units: percent

  clivi_tpt-u-hxy-u:
    description: Total grid-box cloud ice water path
    dims: [lon, lat, time1]
    sources: [{model_var: TGCLDIWP, freq: 3hr}]
    table: atmos
    units: kg m-2

  cll_tpt-u-hxy-u:
    description: Vertically-integrated low cloud
    dims: [lon, lat, time1]
    formula: CLDLOW*100
    sources: [model_var: CLDLOW]
    table: atmos
    units: fraction

  cllmodis_tpt-u-hxy-u:
    description: MODIS Low level cloud fraction
    dims: [lon, lat, time1]
    sources: [model_var: CLLMODIS]
    table: atmos
    units: percent

  clm_tpt-u-hxy-u:
    description: Vertically-integrated mid-level cloud
    dims: [lon, lat, time1]
    formula: CLDMED*100
    sources: [model_var: CLDMED]
    table: atmos
    units: fraction

  clmmodis_tpt-u-hxy-u:
    description: MODIS Mid level cloud fraction
    dims: [lon, lat, time1]
    sources: [model_var: CLMMODIS]
    table: atmos
    units: percent

  clmodis_tpt-u-hxy-u:
    description: MODIS Total Cloud fraction
    dims: [lon, lat, time1]
    sources: [model_var: CLTMODIS]
    table: atmos
    units: percent

  clt_tpt-u-hxy-u:
    description: Vertically-integrated total cloud
    dims: [lon, lat, time1]
    formula: CLDTOT*100
    sources: [{model_var: CLDTOT, freq: 3hr}]
    table: atmos
    units: fraction

  clw_tpt-al-hxy-u:
    description: Grid box averaged cloud liquid amount
    dims: [lon, lat, lev, time1]
    levels: {name: standard_hybrid_sigma, src_axis_bnds: ilev, src_axis_name: lev,
      units: '1'}
    sources: [model_var: CLDLIQ]
    table: atmos
    units: kg/kg

  clwmodis_tpt-u-hxy-u:
    description: MODIS Liquid Cloud Fraction
    dims: [lon, lat, time1]
    sources: [model_var: CLWMODIS]
    table: atmos
    units: percent

  clwvi_tpt-u-hxy-u:
    description: Total grid-box cloud liquid water path
    dims: [lon, lat, time1]
    sources: [{model_var: TGCLDLWP, freq: 3hr}]
    table: atmos
    units: kg m-2

  dtauiccmodis_tpt-u-hxy-u:
    description: MODIS Ice Cloud Optical Thickness*CLIMODIS
    dims: [lon, lat, time1]
    sources: [model_var: TAUIMODIS]
    table: atmos
    units: '1'

  dtaulicmodis_tpt-u-hxy-u:
    description: MODIS Liquid Cloud Optical Thickness*CLWMODIS
    dims: [lon, lat, time1]
    sources: [model_var: TAUWMODIS]
    table: atmos
    units: '1'

  dtaumodis_tpt-u-hxy-u:
    description: MODIS Total Cloud Optical Thickness*CLTMODIS
    dims: [lon, lat, time1]
    sources: [model_var: TAUTMODIS]
    table: atmos
    units: '1'

  fice_tpt-al-hxy-u:
    description: Fractional ice content within cloud
    dims: [lon, lat, time1]
    sources: [model_var: FICE]
    table: atmos
    units: fraction

  icnumcldtop_tpt-u-hxy-u:
    description: Average Cloud Top Ice number
    dims: [lon, lat, time1]
    sources: [model_var: ACTNI]
    table: atmos
    units: m-3

  iwpmodis_tpt-u-hxy-u:
    description: MODIS Cloud Ice Water Path * CLIMODIS
    dims: [lon, lat, time1]
    sources: [model_var: IWPMODIS]
    table: atmos
    units: kg m-2

  lwpmodis_tpt-u-hxy-u:
    description: MODIS Cloud Liquid water Path * CLWMODIS
    dims: [lon, lat, time1]
    sources: [model_var: LWPMODIS]
    table: atmos
    units: kg m-2

  ndnumcldtop_tpt-u-hxy-u:
    description: Average Cloud Top droplet number
    dims: [lon, lat, time1]
    sources: [model_var: ACTNL]
    table: atmos
    units: m-3

  ndnumcldtopb_tpt-u-hxy-u:
    description: Average Cloud Top  droplet number (Bennartz)
    dims: [lon, lat, time1]
    sources: [model_var: ACTNL_B]
    table: atmos
    units: m-3

  numice_tpt-al-hxy-u:
    description: Grid box averaged cloud ice number
    dims: [lon, lat, lev, time1]
    levels: {name: standard_hybrid_sigma, src_axis_bnds: ilev, src_axis_name: lev,
      units: '1'}
    sources: [model_var: NUMICE]
    table: atmos
    units: 1/kg

  numliq_tpt-al-hxy-u:
    description: Grid box averaged cloud liquid number
    dims: [lon, lat, lev, time1]
    levels: {name: standard_hybrid_sigma, src_axis_bnds: ilev, src_axis_name: lev,
      units: '1'}
    sources: [model_var: NUMLIQ]
    table: atmos
    units: 1/kg

  pctmodis_tpt-u-hxy-u:
    description: MODIS Cloud Top Pressure*CLTMODIS
    dims: [lon, lat, time1]
    sources: [model_var: PCTMODIS]
    table: atmos
    units: Pa

  refficcmodis_tpt-u-hxy-u:
    description: MODIS Ice Cloud  Particle Size*CLIMODIS
    dims: [lon, lat, time1]
    sources: [model_var: REFFCLIMODIS]
    table: atmos
    units: m

  refflicmodis_tpt-u-hxy-u:
    description: MODIS Liquid Cloud Particle Size*CLWMODIS
    dims: [lon, lat, time1]
    sources: [model_var: REFFCLWMODIS]
    table: atmos
    units: m

  ta_tpt-al-hxy-u:
    description: Temperature
    dims: [lon, lat, lev, time1]
    levels: {name: standard_hybrid_sigma, src_axis_bnds: ilev, src_axis_name: lev,
      units: '1'}
    sources: [{model_var: T, freq: 3hr}, {model_var: T, freq: 6hr}]
    table: atmos
    units: K

  albisccp_tavg-u-hxy-cl:
    description: Time-means are weighted by the ISCCP Total Cloud Fraction - see  https://www.cfmip.org/tools-and-data/cosp.
      Values will be missing where there are no clouds or no sunlight.
    dims: [lon, lat, time]
    formula: MEANCLDALB_ISCCP/CLDTOT_ISCCP
    sources: [{model_var: MEANCLDALB_ISCCP, freq: day}, {model_var: CLDTOT_ISCCP, freq: day}, {model_var: MEANCLDALB_ISCCP, freq: mon}, {model_var: CLDTOT_ISCCP, freq: mon}]
    table: atmos
    units: '1'

  aod550volso4_tavg-u-hxy-u:
    description: This is the monthly averaged aerosol optical thickness at 550 nm
      due to stratospheric volcanic sulphate aerosols
    dims: [lon, lat, time, lambda550nm]
    sources: [{model_var: AODVVOLC, freq: mon}]
    table: atmos
    units: '1.00E-09'

  areacella_ti-u-hxy-u:
    description: Cell areas for any grid used to report atmospheric variables and
      any other variable using that grid (e.g., soil moisture content). These cell
      areas should be defined to enable exact calculation of global integrals (e.g.,
      of vertical fluxes of energy at the surface and top of the atmosphere).
    dims: [lon, lat]
    sources: [{model_var: area, freq: fx}]
    table: atmos
    units: m2

  bldep_tavg-u-hxy-u:
    description: Boundary layer depth
    dims: [lon, lat, time]
    sources: [{model_var: PBLH, freq: 1hr}, {model_var: PBLH, freq: mon}]
    table: atmos
    units: m

  bldep_tmax-u-hxy-u:
    description: 'maximum boundary layer height during the day (add cell_methods attribute:
      "time: maximum")'
    dims: [lon, lat, time]
    sources: [{model_var: PBLHMX, freq: day}]
    table: atmos
    units: m

  bldep_tmin-u-hxy-u:
    description: 'minimum boundary layer height during the day (add cell_methods attribute:
      "time: minimum")'
    dims: [lon, lat, time]
    sources: [{model_var: PBLHMN, freq: day}]
    table: atmos
    units: m

  cfadDbze94_tavg-h40-hxy-air:
    description: CloudSat Radar Reflectivity
    dims: [lon, lat, alt40, dbze, time]
    sources: [{model_var: CFAD_DBZE94_CS, freq: mon}]
    table: atmos
    units: '1'

  cfadLidarsr532_tavg-h40-hxy-air:
    description: CALIPSO Scattering Ratio
    dims: [lon, lat, alt40, scatratio, time]
    sources: [{model_var: CFAD_SR532_CAL, freq: mon}]
    table: atmos
    units: '1'

  cl_tavg-al-hxy-u:
    description: Percentage cloud cover, including both large-scale and convective
      cloud.
    dims: [lon, lat, lev, time]
    levels: {name: standard_hybrid_sigma, src_axis_bnds: ilev, src_axis_name: lev,
      units: '1'}
    sources: [{model_var: CLOUD, freq: day}, {model_var: CLOUD, freq: mon}]
    table: atmos
    units: '%'

  cli_tavg-al-hxy-u:
    description: Includes both large-scale and convective cloud.  This is calculated
      as the mass of cloud ice in the grid cell divided by the mass of air (including
      the water in all phases) in the grid cell. It includes precipitating hydrometeors
      ONLY if the precipitating hydrometeors affect the calculation of radiative transfer
      in model.
    dims: [lon, lat, lev, time]
    levels: {name: standard_hybrid_sigma, src_axis_bnds: ilev, src_axis_name: lev,
      units: '1'}
    sources: [{model_var: CLDICE, freq: day}, {model_var: CLDICE, freq: mon}]
    table: atmos
    units: kg kg-1

  clisccp_tavg-p7c-hxy-air:
    description: Percentage cloud cover in optical depth categories.
    dims: [time, plev, lat, lon, tau]
    levels: {name: plev7c, units: Pa}
    sources: [{model_var: FISCCP1_COSP, freq: day}, {model_var: FISCCP1_COSP, freq: mon}]
    table: atmos
    units: '%'

  clivi_tavg-u-hxy-u:
    description: Ice water path
    dims: [lon, lat, time]
    sources: [{model_var: TGCLDIWP, freq: 3hr}, {model_var: TGCLDIWP, freq: day}, {model_var: TGCLDIWP, freq: mon}]
    table: atmos
    units: kg m-2

  clt_tavg-u-hxy-u:
    description: for the whole atmospheric column, as seen from the surface or the
      top of the atmosphere. Include both large-scale and convective cloud.
    dims: [lon, lat, time]
    formula: CLDTOT*100
    sources: [{model_var: CLDTOT, freq: 1hr}, {model_var: CLDTOT, freq: 3hr}, {model_var: CLDTOT, freq: day}, {model_var: CLDTOT, freq: mon}]
    table: atmos
    units: '%'

  cltc_tavg-u-hxy-u:
    description: Convective cloud fraction
    dims: [lon, lat, time]
    formula: CONCLD*100
    sources: [{model_var: CONCLD, freq: mon}]
    table: atmos
    units: '%'

  cltisccp_tavg-u-hxy-u:
    description: Total cloud area fraction (reported as a percentage) for the whole
      atmospheric column, as seen by the International Satellite Cloud Climatology
      Project (ISCCP) analysis. Includes both large-scale and convective cloud.  (MODIS).
      Includes both large-scale and convective cloud.
    dims: [lon, lat, time]
    sources: [{model_var: CLDTOT_ISCCP, freq: day}, {model_var: CLDTOT_ISCCP, freq: mon}]
    table: atmos
    units: '%'

  clw_tavg-al-hxy-u:
    description: Includes both large-scale and convective cloud.  Calculate as the
      mass of cloud liquid water in the grid cell divided by the mass of air (including
      the water in all phases) in the grid cells. Precipitating hydrometeors are included
      ONLY if the precipitating hydrometeors affect the calculation of radiative transfer
      in model.
    dims: [lon, lat, lev, time]
    levels: {name: standard_hybrid_sigma, src_axis_bnds: ilev, src_axis_name: lev,
      units: '1'}
    sources: [{model_var: CLDLIQ, freq: day}, {model_var: CLDLIQ, freq: mon}]
    table: atmos
    units: kg kg-1

  clwmodis_tavg-u-hxy-u:
    description: MODIS Liquid Cloud Fraction
    dims: [lon, lat, time]
    sources: [{model_var: CLWMODIS, freq: mon}]
    table: atmos
    units: '%'

  evspsbl_tavg-u-hxy-lnd:
    description: 'Evaporation at surface (also known as evapotranspiration): flux
      of water into the atmosphere due to conversion of both liquid and solid phases
      to vapor (from underlying surface and vegetation)'
    dims: [lon, lat, time]
    formula: QVEGT+QVEGE+QSOIL
    sources: [{model_var: QVEGT, freq: day}, {model_var: QVEGE, freq: day}, {model_var: QSOIL, freq: day}]
    table: atmos
    units: kg m-2 s-1

  hfls_tavg-u-hxy-u:
    description: This is the 3-hour mean flux.
    dims: [lon, lat, time]
    positive: up
    sources: [{model_var: LHFLX, freq: 1hr}, {model_var: LHFLX, freq: 3hr}, {model_var: LHFLX, freq: day}, {model_var: LHFLX, freq: mon}]
    table: atmos
    units: W m-2

  hfss_tavg-u-hxy-u:
    description: The surface sensible heat flux, also called turbulent heat flux,
      is the exchange of heat between the surface and the air by motion of air.
    dims: [lon, lat, time]
    positive: up
    sources: [{model_var: SHFLX, freq: 1hr}, {model_var: SHFLX, freq: 3hr}, {model_var: SHFLX, freq: day}, {model_var: SHFLX, freq: mon}]
    table: atmos
    units: W m-2

  hur_tavg-p19-hxy-air:
    description: This is the relative humidity with respect to liquid water for T>
      0 C, and with respect to ice for T<0 C.
    dims: [time, plev, lat, lon]
    levels: {name: plev19, units: Pa}
    sources: [{model_var: RELHUM, freq: mon}, {model_var: RHW, freq: mon}]
    table: atmos
    units: '%'

  hur_tavg-p19-hxy-u:
    description: This is the relative humidity with respect to liquid water for T>
      0 C, and with respect to ice for T<0 C.
    dims: [time, plev, lat, lon]
    levels: {name: plev19, units: Pa}
    sources: [{model_var: RELHUM, freq: day}, {model_var: RHW, freq: day}]
    table: atmos
    units: '%'

  hurs_tavg-h2m-hxy-u:
    description: This is the relative humidity with respect to liquid water for T>
      0 C, and with respect to ice for T<0 C.
    dims: [lon, lat, time, height2m]
    sources: [{model_var: RHREFHT, freq: 1hr}, {model_var: RHREFHT, freq: 6hr}, {model_var: RHREFHT, freq: day}, {model_var: RHREFHT, freq: mon}]
    table: atmos
    units: '%'

  hurs_tmax-h2m-hxy-u:
    description: This is the relative humidity with respect to liquid water for T>
      0 C, and with respect to ice for T<0 C.
    dims: [lon, lat, time, height2m]
    sources: [{model_var: RHREFHTMX, freq: day}]
    table: atmos
    units: '%'

  hurs_tmin-h2m-hxy-u:
    description: This is the relative humidity with respect to liquid water for T>
      0 C, and with respect to ice for T<0 C.
    dims: [lon, lat, time, height2m]
    sources: [{model_var: RHREFHTMN, freq: day}]
    table: atmos
    units: '%'

  hus_tavg-al-hxy-u:
    description: Specific humidity is the mass fraction of water vapor in (moist)
      air.
    dims: [lon, lat, lev, time]
    levels: {name: standard_hybrid_sigma, src_axis_bnds: ilev, src_axis_name: lev,
      units: '1'}
    sources: [{model_var: Q, freq: day}, {model_var: Q, freq: mon}]
    table: atmos
    units: '1'

  hus_tavg-p19-hxy-u:
    description: Specific humidity is the mass fraction of water vapor in (moist)
      air.
    dims: [time, plev, lat, lon]
    levels: {name: plev19, units: Pa}
    sources: [{model_var: Q, freq: day}, {model_var: Q, freq: mon}]
    table: atmos
    units: '1'

  huss_tavg-h2m-hxy-u:
    description: Near-surface (usually, 2 meter) specific humidity.
    dims: [lon, lat, time, height2m]
    sources: [{model_var: QREFHT, freq: 6hr}, {model_var: QREFHT, freq: day}, {model_var: QREFHT, freq: mon}]
    table: atmos
    units: '1'

  loadbc_tavg-u-hxy-u:
    description: The total dry mass of black carbon aerosol particles per unit area.
    dims: [lon, lat, time]
    formula: BC_A+BC_AC+BC_AI+BC_AX+BC_N+BC_NI
    sources: [{model_var: BC_A, freq: day}, {model_var: BC_AC, freq: day}, {model_var: BC_AI, freq: day}, {model_var: BC_AX, freq: day}, {model_var: BC_N, freq: day}, {model_var: BC_NI, freq: day}]
    table: atmos
    units: kg m-2

  loadso4_tavg-u-hxy-u:
    description: The total dry mass of sulfate aerosol particles per unit area.
    dims: [lon, lat, time]
    formula: SO4_A1*3+SO4_A2*3+SO4_AC*3+SO4_N*3+SO4_NA*3+SO4_PR*3
    sources: [{model_var: SO4_A1, freq: day}, {model_var: SO4_A2, freq: day}, {model_var: SO4_AC, freq: day}, {model_var: SO4_N, freq: day}, {model_var: SO4_NA, freq: day}, {model_var: SO4_PR, freq: day}, {model_var: SO4_A1, freq: mon}, {model_var: SO4_A2, freq: mon}, {model_var: SO4_AC, freq: mon}, {model_var: SO4_N, freq: mon}, {model_var: SO4_NA, freq: mon}, {model_var: SO4_PR, freq: mon}]
    table: atmos
    units: kg m-2

  pctisccp_tavg-u-hxy-cl:
    description: time-means are weighted by the ISCCP Total Cloud Fraction - see  https://www.cfmip.org/tools-and-data/cosp
    dims: [lon, lat, time]
    formula: MEANPTOP_ISCCP/CLDTOT_ISCCP
    sources: [{model_var: MEANPTOP_ISCCP, freq: day}, {model_var: CLDTOT_ISCCP, freq: day}, {model_var: MEANPTOP_ISCCP, freq: mon}, {model_var: CLDTOT_ISCCP, freq: mon}]
    table: atmos
    units: Pa

  pr_tavg-u-hxy-u:
    description: at surface; includes both liquid and solid phases from all types
      of clouds (both large-scale and convective)
    dims: [lon, lat, time]
    sources: [{model_var: PRECT, freq: 1hr}, {model_var: PRECT, freq: 3hr}, {model_var: PRECT, freq: 6hr}, {model_var: PRECT, freq: day}, {model_var: PRECT, freq: mon}]
    table: atmos
    units: kg m-2 s-1

  prra_tavg-u-hxy-lnd:
    description: rainfall_flux
    dims: [lon, lat, time]
    formula: PRECT-PRECSC-PRECSL
    sources: [{model_var: PRECT, freq: day}, {model_var: PRECSC, freq: day}, {model_var: PRECSL, freq: day}]
    table: atmos
    units: kg m-2 s-1

  prsn_tavg-u-hxy-u:
    description: at surface.  Includes precipitation of all forms water in the solid
      phase.  This is the 3-hour mean snowfall flux.
    dims: [lon, lat, time]
    formula: PRECSC+PRECSL
    sources: [{model_var: PRECSC, freq: 3hr}, {model_var: PRECSL, freq: 3hr}, {model_var: PRECSC, freq: 6hr}, {model_var: PRECSL, freq: 6hr}, {model_var: PRECSC, freq: day}, {model_var: PRECSL, freq: day}, {model_var: PRECSC, freq: mon}, {model_var: PRECSL, freq: mon}]
    table: atmos
    units: kg m-2 s-1

  ps_tavg-u-hxy-u:
    description: surface pressure (not mean sea-level pressure), 2-D field to calculate
      the 3-D pressure field from hybrid coordinates
    dims: [lon, lat, time]
    sources: [{model_var: PS, freq: 1hr}, {model_var: PS, freq: 6hr}, {model_var: PS, freq: day}, {model_var: PS, freq: mon}]
    table: atmos
    units: Pa

  psl_tavg-u-hxy-u:
    description: Sea Level Pressure
    dims: [lon, lat, time]
    sources: [{model_var: PSL, freq: 6hr}, {model_var: PSL, freq: day}, {model_var: PSL, freq: mon}]
    table: atmos
    units: Pa

  ptp_tavg-u-hxy-u:
    description: 2D monthly mean thermal tropopause calculated using WMO tropopause
      definition on 3d temperature
    dims: [lon, lat, time]
    sources: [{model_var: TROP_P, freq: mon}]
    table: atmos
    units: Pa

  rld_tavg-alh-hxy-u:
    description: Includes also the fluxes at the surface and TOA.
    dims: [lon, lat, alevhalf, time]
    sources: [{model_var: FDL, freq: mon}]
    table: atmos
    units: W m-2

  rldcs_tavg-alh-hxy-u:
    description: Includes also the fluxes at the surface and TOA.
    dims: [lon, lat, alevhalf, time]
    sources: [{model_var: FDLC, freq: mon}]
    table: atmos
    units: W m-2

  rlds_tavg-u-hxy-u:
    description: Surface downwelling longwave radiation
    dims: [lon, lat, time]
    positive: down
    sources: [{model_var: FLDS, freq: 1hr}, {model_var: FLDS, freq: 3hr}, {model_var: FLDS, freq: 6hr}, {model_var: FLDS, freq: day}, {model_var: FLDS, freq: mon}]
    table: atmos
    units: W m-2

  rldscs_tavg-u-hxy-u:
    description: Surface downwelling clear-sky longwave radiation
    dims: [lon, lat, time]
    sources: [{model_var: FLDSC, freq: day}, {model_var: FLDSC, freq: mon}]
    table: atmos
    units: W m-2

  rls_tavg-u-hxy-u:
    description: Net longwave surface radiation
    dims: [lon, lat, time]
    positive: up
    sources: [{model_var: FLNS, freq: day}, {model_var: FLNS, freq: mon}]
    table: atmos
    units: W m-2

  rlu_tavg-alh-hxy-u:
    description: Includes also the fluxes at the surface and TOA.
    dims: [lon, lat, alevhalf, time]
    sources: [{model_var: FUL, freq: mon}]
    table: atmos
    units: W m-2

