    dims: [lon, lat, time, height10m]
    sources: [{model_var: U10, freq: 1hr}, {model_var: U10, freq: 3hr}, {model_var: U10, freq: 6hr}, {model_var: U10, freq: day}, {model_var: U10, freq: mon}]
    table: atmos
    units: m s-1

  ta_tavg-700hPa-hxy-air:
    description: Air temperature at 700hPa
    dims: [lon, lat, time, p700]
    sources: [{model_var: T700, freq: day}]
