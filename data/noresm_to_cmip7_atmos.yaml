  rlut_tavg-u-hxy-u:
    description: TOA outgoing longwave radiation
    dims: [lon, lat, time]
    formula: FSNTOA-FSNT+FLNT
    positive: up
    sources: [{model_var: FSNTOA, freq: 3hr}, {model_var: FSNT, freq: 3hr}, {model_var: FLNT, freq: 3hr}, {model_var: FSNTOA, freq: day}, {model_var: FSNT, freq: day}, {model_var: FLNT, freq: day}, {model_var: FSNTOA, freq: mon}, {model_var: FSNT, freq: mon}, {model_var: FLNT, freq: mon}]
