    sources: [{model_var: FDS, freq: mon}]
    table: atmos
    units: W m-2

  rss_tavg-u-hxy-u:
    description: Net downward shortwave radiation at the surface
    dims: [lon, lat, time]
    positive: down
    sources: [{model_var: FSNS, freq: day}, {model_var: FSNS, freq: mon}]
    table: atmos
    units: W m-2

  rsus_tavg-u-hxy-u:
    description: This is the 3-hour mean flux.
    dims: [lon, lat, time]
    formula: FSDS-FSNS
    positive: up
    sources: [{model_var: FSDS, freq: 1hr}, {model_var: FSNS, freq: 1hr}, {model_var: FSDS, freq: 3hr}, {model_var: FSNS, freq: 3hr}, {model_var: FSDS, freq: day}, {model_var: FSNS, freq: day}, {model_var: FSDS, freq: mon}, {model_var: FSNS, freq: mon}]
    table: atmos
    units: W m-2

  rsuscs_tavg-u-hxy-u:
    description: Surface Upwelling Clear-sky Shortwave Radiation
    dims: [lon, lat, time]
    formula: FSDSC-FSNSC
    positive: up
    sources: [{model_var: FSDSC, freq: day}, {model_var: FSNSC, freq: day}, {model_var: FSDSC, freq: mon}, {model_var: FSNSC, freq: mon}]
    table: atmos
    units: W m-2

  rsut_tavg-u-hxy-u:
    description: TOA outgoing shortwave radiation
    dims: [lon, lat, time]
    positive: up
    sources: [{model_var: FSUTOA, freq: 3hr}, {model_var: FSUTOA, freq: day}, {model_var: FSUTOA, freq: mon}]
    table: atmos
    units: W m-2

  rsutcs_tavg-u-hxy-u:
    description: TOA outgoing clear sky shortwave
    dims: [lon, lat, time]
    formula: SOLIN-FSNTOAC
    positive: up
    sources: [{model_var: SOLIN, freq: 3hr}, {model_var: FSNTOAC, freq: 3hr}, {model_var: SOLIN, freq: day}, {model_var: FSNTOAC, freq: day}, {model_var: SOLIN, freq: mon}, {model_var: FSNTOAC, freq: mon}]
    table: atmos
    units: W m-2

  sfcWind_tavg-h10m-hxy-u:
    description: This is the mean of the speed, not the speed computed from the mean
